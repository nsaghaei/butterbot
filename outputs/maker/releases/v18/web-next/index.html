<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garden</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/style.css"></head><body>
<main><section id="scene"><div id="world-controls"><span id="pause-state" role="status" hidden>Simulation paused</span><button id="pause-control" type="button" aria-pressed="false" disabled>Pause</button></div><div id="selection-card" hidden></div><div class="scene-footer"><span id="fps"></span></div></section>
<aside><div id="mobile-panel-bar"><button id="activity-toggle" type="button" aria-expanded="true" aria-controls="activity-body"><span id="activity-toggle-label">Hide activity</span><span id="activity-summary">Connecting</span><span class="panel-chevron" aria-hidden="true">⌄</span></button></div><div id="activity-body"><div id="cast" role="group" aria-label="Select character"></div><div class="character-heading"><div><h1 id="character-name">Butterbot</h1><p id="character-style"></p></div><span id="stage">Connecting</span></div><div id="needs"></div><div id="brain-status"><span data-brain="laya">&#9679; Laya</span><span data-brain="gemma">&#9679; Gemma</span></div><div class="goal"><span>Current goal</span><p id="objective">Tell Butterbot something.</p><details id="plan-panel"><summary id="plan-progress">Planning…</summary><ol id="plan-list"></ol></details><div id="request-status" hidden><span id="request-state"></span><span id="request-text"></span><button id="retry-request" type="button" hidden>Retry</button></div></div><div id="busy" role="status"></div>
<div id="feeds"><section id="thought-feed"><div class="feed-bar"><span>Thoughts & decisions <button id="feed-latest" hidden>New items ↓</button></span><label><input id="follow" type="checkbox" checked> Follow latest</label></div>
<div id="panel-scroll"><div id="history"></div><div id="current-question"></div></div></section><div id="feed-divider" role="separator" tabindex="0" aria-label="Resize thoughts and memory panes" aria-orientation="horizontal" aria-valuemin="20" aria-valuemax="80" aria-valuenow="50"></div><section id="memory-feed">
<div class="feed-bar memory-bar"><span>Memory <b id="memory-count">0</b> <button id="memory-latest" hidden>New items ↓</button></span><label><input id="memory-follow" type="checkbox" checked> Follow latest</label></div><div id="memory-scroll"><details id="core"><summary>Permanent character</summary><div id="core-content"></div></details><div id="memory-list"></div></div></section></div><details id="inspector"><summary>Character details</summary><div class="inspector-body"><details id="actions-panel"><summary>Available actions</summary><div id="actions-list"></div></details><details id="diagnostics"><summary>Diagnostics</summary><div id="diagnostic-content"></div></details></div></details></div><form id="talk-form"><label for="objective-input" id="talk-label">Tell Butterbot something</label><div class="composer"><textarea id="objective-input" rows="2" maxlength="240" placeholder="Get a squishy red panda."></textarea><button id="send" type="submit" aria-label="Send to character">&#8593;</button></div><div class="composer-footer"><p id="send-status"></p><div class="footer-actions"><button id="sound-toggle" type="button" aria-label="Mute printer sound" aria-pressed="false" title="Printer sound on"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path class="sound-waves" d="M16 8c2 2 2 6 0 8m3-11c4 4 4 10 0 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path class="sound-slash" d="M3 3l18 18" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button><button id="reset-scene" type="button" title="Reset objects, goals and memories">Reset everything</button></div></div></form></aside></main><div id="toast" role="status"></div><script type="module" src="/app.js"></script></body></html>
